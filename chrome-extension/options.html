<!doctype html><html><head><meta charset="utf-8"><title>Nexus Zendesk Copilot Settings</title><style>body{font:14px Arial;background:#0b1020;color:#eef2ff;max-width:760px;margin:40px auto;padding:0 20px}section{background:#121a2f;border:1px solid #28324f;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 5px}input,select,button{box-sizing:border-box;background:#0f1629;color:white;border:1px solid #34405e;border-radius:8px;padding:10px}input[type=text],input[type=number]{width:100%}button{cursor:pointer;background:#1d2c4d}.row{display:flex;gap:10px;align-items:center}.row input{width:auto}.muted{opacity:.65}.ok{color:#7ee3a5}</style></head><body><h1>Nexus Zendesk Copilot</h1><p class="muted">Only settings are stored in Chrome. Ticket content is not persisted here.</p><section><h2>Connection</h2><label>Backend URL</label><input id="backendUrl" type="text" placeholder="http://localhost:3000"><p class="muted">Use the internal server URL or your Cloudflare hostname. The tunnel credential is never stored in this extension.</p><button id="permission">Grant permission for this backend</button></section><section><h2>Monitoring</h2><label class="row"><input id="autoAnalyze" type="checkbox"> Auto analyze when ticket changes</label><label>Debounce (ms)</label><input id="debounceMs" type="number" min="1000" max="10000"></section><section><h2>Privacy</h2><label class="row"><input id="stripEmail" type="checkbox"> Strip email addresses before sending</label><label class="row"><input id="stripPhone" type="checkbox"> Strip phone numbers before sending</label><label class="row"><input id="stripGuestName" type="checkbox"> Strip guest name when available</label></section><button id="save">Save Settings</button> <span id="status" class="ok"></span><script src="options.js"></script></body></html>
